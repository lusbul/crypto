<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Практика 2 · Криптографія</title><link rel="stylesheet" href="styles.css"></head><body><main class="wrap"><a href="index.html">← До місії 2.4</a><div class="tag">ПРАКТИКА 2 / 4</div><h1>Літери залишають сліди</h1><section><p>Частотний аналіз — це статистична підказка. Порівняйте короткий і довгий тексти; зверніть увагу, як змінюються найчастіші літери.</p><label>Набір тексту <select id="sample"><option value="short">Короткий</option><option value="long">Довгий</option></select></label><button class="btn" id="run">Дослідити частоти</button><div id="chart"></div><label>Чи можна за одним коротким текстом надійно визначити ключ підстановки? <select id="answer"><option value="">Оберіть</option><option value="yes">Так, завжди</option><option value="no">Ні, частоти — лише гіпотеза</option></select></label><button class="btn" id="verify">Перевірити</button><button class="btn alt" id="hint">💡 Підказка</button><div id="feedback" class="result"></div></section><a class="btn" href="practice-3.html">Наступна практика →</a><footer>Криптографія · Подорож у часі · Місія 2.4</footer></main><script src="common.js"></script><script>let short='КІТ',long='БУЧ ДОСЛІДЖУЄ КРИПТОГРАФІЮ І ПОРІВНЮЄ ЧАСТОТИ ЛІТЕР У ДОВГОМУ ТЕКСТІ КОЖНА ЛІТЕРА ЗАЛИШАЄ СТАТИСТИЧНИЙ СЛІД';$('run').onclick=()=>{let t=$('sample').value==='short'?short:long;let m={};for(let c of t.replace(/[^А-ЯІЇЄҐ]/g,''))m[c]=(m[c]||0)+1;let entries=Object.entries(m).sort((a,b)=>b[1]-a[1]);let table=document.createElement('table');table.innerHTML='<tr><th>Літера</th><th>Кількість</th><th>Частка</th></tr>';let total=entries.reduce((a,x)=>a+x[1],0);for(let [c,n] of entries){let tr=document.createElement('tr');for(let v of [c,n,(100*n/total).toFixed(1)+'%']){let td=document.createElement('td');td.textContent=v;tr.append(td)}table.append(tr)}$('chart').replaceChildren(table)};$('run').click();$('verify').onclick=()=>feedback($('answer').value==='no','Так: мала вибірка нестійка, а частоти не є доказом ключа.','Пригадайте, чому коротка вибірка може вводити в оману.');$('hint').onclick=()=>{$('feedback').textContent='У слові КІТ усі три літери трапляються однаково часто.'}</script></body></html>
