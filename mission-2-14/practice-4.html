<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080f1c"><title>Архітектор захисту · Місія 2.14</title><link rel="stylesheet" href="styles.css"></head><body><header><a href="index.html">← До місії 2.14</a><a href="https://lusbul.github.io/crypto/#chapter-2">Маршрут курсу</a></header><main><h1>Практика 4. Архітектор захисту</h1><p>Два рівні складності. Перетягніть компоненти в правильному порядку; на телефоні торкніться картки та комірки.</p><section class="panel"><label>Рівень <select id="level"><option value="1">1 · Захист повідомлення</option><option value="2">2 · Захист від MITM</option></select></label><div id="bank"></div><div id="zone"></div><button id="check">Перевірити схему</button><button class="secondary" id="hint">Підказка</button><div class="feedback" id="feedback"></div></section><section class="panel"><h2>Перевірте архітектуру</h2><p>Чи достатньо лише ECDH, щоб переконатися, що Ви спілкуєтеся саме з Бучем?</p><button id="yes">Так</button><button id="no">Ні</button><p id="reason"></p></section></main><script src="common.js"></script><script>let s;function start(){let l=$('#level').value;let items=l==='1'?['ECDH: узгодити секрет','KDF: вивести ключ','AES-GCM: створити захищений пакет','Одержувач: перевірити тег']:['Перевірити справжність відкритого ключа співрозмовника','ECDH: узгодити секрет','KDF: вивести ключ із контекстом','AES-GCM: зашифрувати з унікальним nonce','Перевірити тег перед використанням даних'];s=setupSort(items,$('#zone'),$('#bank'))}$('#level').onchange=()=>{start();say('Схему оновлено.')};start();$('#check').onclick=()=>say(s.check()?'Вірно! Схему зібрано.':'Є помилка в порядку. Спробуйте ще раз.',s.check());$('#hint').onclick=()=>say($('#level').value==='2'?'Спочатку перевірте співрозмовника; потім узгодьте секрет, виведіть ключ і захистіть пакет.':'Спільний секрет → ключ → шифрування з тегом → перевірка.');$('#yes').onclick=()=>$('#reason').textContent='Ні. ECDH не автентифікує співрозмовника: Єва може підмінити відкриті значення.';$('#no').onclick=()=>$('#reason').textContent='Правильно! Потрібна автентифікація ключів, наприклад перевірені сертифікати та підписи.';</script></body></html>
