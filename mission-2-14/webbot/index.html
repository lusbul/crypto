<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080f1c"><title>Веббот · Операція: захищений канал · Місія 2.14</title><link rel="stylesheet" href="../styles.css"></head><body><header><a href="../index.html">← Головна місії</a><a href="https://lusbul.github.io/crypto/#chapter-2">Маршрут курсу</a></header><main><section class="hero"><div><span class="eyebrow">Веббот · 9 етапів</span><h1>Операція: захищений канал</h1><p>Буч отримав секретний пакет. Допоможіть йому перевірити весь маршрут.</p></div><img src="../assets/buch-hybrid.png" alt="Буч із схемою гібридного захисту"></section><section class="panel" id="game"><div class="progress"><div id="bar" style="width:0"></div></div><p id="counter"></p><h2 id="question"></h2><div id="choices"></div><button class="secondary" id="hint">Підказка</button><div class="feedback" id="feedback"></div></section><section class="panel" id="finish" hidden><h2>Місію завершено!</h2><p>Ваш персональний навчальний паспорт створюється лише тут, у вебботі.</p><label>Псевдонім <input id="nick" maxlength="45" placeholder="Наприклад, Криптодослідник"></label><button id="passport">Створити паспорт для друку в PDF</button><div id="passport-area"></div></section></main><script src="../common.js"></script><script>const tasks=[['Що дає ECDH?',['Узгодити спільний секрет','Стиснути файл','Створити тег без ключа'],0,'ECDH — узгодження, не шифрування.'],['Що можна передавати відкрито?',['Приватний показник','Відкритий ключ','Секретний ключ AES'],1,'Приватне число не передають.'],['Навіщо потрібна KDF?',['Вивести придатний ключ із секрету','Замінити автентифікацію','Стерти nonce'],0,'KDF перетворює секрет на ключовий матеріал.'],['Що правильно про nonce?',['Завжди секретний','Можна повторювати','Має бути унікальним для ключа'],2,'У AES-GCM повтор nonce з тим самим ключем небезпечний.'],['Які частини містить пакет AEAD?',['Лише відкритий текст','Nonce, шифротекст і тег (AAD за потреби)','Тільки відкритий ключ'],1,'Згадайте пакет із практики 3.'],['Єва змінює біт шифротексту. Що робити?',['Відхилити пакет після невдалої перевірки','Використати частково розшифроване','Ігнорувати тег'],0,'Не використовуйте дані без успішної перевірки.'],['Єва змінює AAD. Що станеться?',['Нічого','Перевірка тегу не пройде','Зміниться лише колір інтерфейсу'],1,'AAD не шифрується, але автентифікується.'],['Чим небезпечний ECDH без автентифікації?',['Можлива атака посередника','Зникає можливість шифрувати','Не працює модульна арифметика'],0,'Єва може підмінити відкриті значення.'],['Яка схема повна?',['AES-GCM → нічого більше','ECDH → KDF → AEAD → перевірка + автентифікація співрозмовника','Лише ECDH'],1,'Захист має включати перевірку особи та цілісності.']];let i=0;function render(){if(i>=tasks.length){$('#game').hidden=true;$('#finish').hidden=false;return}let t=tasks[i];$('#bar').style.width=(i/tasks.length*100)+'%';$('#counter').textContent=`Етап ${i+1} із 9`;$('#question').textContent=t[0];$('#choices').innerHTML='';t[1].forEach((v,j)=>{let b=document.createElement('button');b.className='secondary';b.textContent=v;b.onclick=()=>{if(j===t[2]){say('Правильно!');i++;setTimeout(render,380)}else say('Спробуйте ще раз. Підказка допоможе.',false)};$('#choices').append(b)});say('')}$('#hint').onclick=()=>say(tasks[i][3]);render();$('#passport').onclick=()=>{let nick=$('#nick').value.trim();if(!nick){say('Введіть псевдонім.',false);return}let code=Array.from(crypto.getRandomValues(new Uint8Array(8)),x=>x.toString(16).padStart(2,'0')).join('').toUpperCase();let p=document.createElement('section');p.className='panel';p.style.background='white';p.style.color='#14213b';p.innerHTML='<h2 style="color:#14213b">Навчальний паспорт · Місія 2.14</h2>';let lines=['Псевдонім: '+nick,'Місія: 2.14 «Гібридний захист»','Дата: '+new Date().toLocaleDateString('uk-UA'),'Випадковий код: '+code,'Навчальна імітація цифрового підпису; не є справжнім електронним підписом.'];lines.forEach(t=>{let el=document.createElement('p');el.textContent=t;p.append(el)});$('#passport-area').replaceChildren(p);let btn=document.createElement('button');btn.className='no-print';btn.textContent='Друк / зберегти як PDF';btn.onclick=()=>window.print();$('#passport-area').append(btn);say('Паспорт готовий. У вікні друку виберіть «Зберегти як PDF».')};</script></body></html>
