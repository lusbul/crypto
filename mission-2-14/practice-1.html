<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080f1c"><title>Збери захищений маршрут · Місія 2.14</title><link rel="stylesheet" href="styles.css"></head><body><header><a href="index.html">← До місії 2.14</a><a href="https://lusbul.github.io/crypto/#chapter-2">Маршрут курсу</a></header><main><h1>Практика 1. Збери захищений маршрут</h1><p>Перетягніть картки в чотири комірки в правильному порядку. На смартфоні: торкніться картки, потім комірки.</p><section class="panel"><h2>Картки</h2><div id="bank"></div><h2>Маршрут</h2><div id="zone"></div><button id="check">Перевірити</button><button class="secondary" id="hint">Підказка</button><button class="secondary" id="reset">Ще раз</button><div class="feedback" id="feedback"></div></section><section class="panel"><h2>Дослід</h2><label><input type="checkbox" id="skip"> Пропустити перевірку тегу</label><button id="risk">Що зміниться?</button><p id="result"></p></section></main><script src="common.js"></script><script>const steps=['ECDH: узгодити спільний секрет','KDF: отримати ключ із секрету','AEAD: зашифрувати пакет і створити тег','Одержувач: перевірити тег перед використанням'];const s=setupSort(steps,$('#zone'),$('#bank'));$('#check').onclick=()=>say(s.check()?'Правильно! Кожен механізм виконує свою роль.':'Порядок поки неправильний. Почніть із узгодження секрету.',s.check());$('#hint').onclick=()=>say('Спочатку спільний секрет, потім ключ, потім пакет і лише тоді його перевірка.');$('#reset').onclick=()=>{s.reset();say('Спробуйте інший порядок.')};$('#risk').onclick=()=>$('#result').textContent=$('#skip').checked?'Без перевірки тегу одержувач не має підтвердження цілісності пакета. Це небезпечно.':'Перевірка тегу дозволяє відхилити змінений пакет.';</script></body></html>
