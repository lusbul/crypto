<!DOCTYPE html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Таємниці Біблії · Практика Атбаш</title><style>
:root{color-scheme:dark;--bg:#080f1c;--panel:#102332;--line:#294858;--text:#edf7ff;--muted:#b0c5d5;--cyan:#63e9db;--gold:#f0c67c;font:17px/1.6 'Segoe UI',Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(at 85% 0,#16424777,transparent 50%),var(--bg);color:var(--text)}main,header,footer{width:min(920px,calc(100% - 32px));margin:auto}header{padding:22px 0;display:flex;justify-content:space-between;gap:15px;border-bottom:1px solid var(--line)}a{color:var(--cyan)}h1{font-size:clamp(1.9rem,5vw,3rem);line-height:1.15;margin:18px 0}h2{font-size:1.3rem;margin:12px 0}p{margin:12px 0}.muted{color:var(--muted)}.eyebrow{color:var(--gold);letter-spacing:.12em;font-size:.78rem;text-transform:uppercase}.intro{padding:32px 0 22px}.panel,.message{border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:24px;margin-bottom:18px}.bot{border-top:3px solid var(--cyan)}.speaker{font-size:.82rem;color:var(--cyan);font-weight:700}.reply{margin-left:45px;background:#153137}.progress{display:flex;gap:7px;padding:12px 0 22px}.dot{height:7px;background:#294351;flex:1;border-radius:5px}.dot.done{background:var(--cyan)}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:12px 18px;background:#183445;color:var(--text);min-height:48px}button:hover{border-color:var(--cyan)}button:disabled{cursor:default;opacity:.55}.primary{background:var(--cyan);color:#08212b;font-weight:700;border:0}.secondary{background:transparent}input,textarea,select{background:#071824;border:1px solid #4c6a79;border-radius:9px;color:var(--text);padding:12px;width:100%}input[type=range]{padding:0;accent-color:var(--cyan)}textarea{min-height:100px;resize:vertical}label{display:block;margin:16px 0 6px}fieldset{border:0;margin:18px 0;padding:0}legend{margin-bottom:10px}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}.choices{display:grid;gap:10px}.choice{text-align:left}.choice[aria-pressed=true]{background:#21514f;border-color:var(--cyan)}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.feedback{padding:12px 16px;border-left:3px solid var(--gold);background:#e9bb6c0c;margin-top:16px}.success{border-color:var(--cyan);color:#a8fff1}.cipher{font-family:Consolas,monospace;letter-spacing:.1em;font-size:1.4rem;overflow-wrap:anywhere;color:var(--gold);padding:16px;background:#071824;border-radius:10px}.alphabet{overflow:auto;white-space:nowrap;background:#071824;padding:12px;font:16px/1.8 Consolas,monospace;letter-spacing:.18em;border-radius:10px}.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}.order{list-style:none;padding:0;counter-reset:steps}.order li{counter-increment:steps;display:flex;align-items:center;gap:10px;border:1px solid var(--line);margin:8px 0;padding:10px;border-radius:10px}.order li:before{content:counter(steps);color:var(--cyan)}.order span{flex:1}.order button{padding:5px 12px;min-height:40px}details{border:1px dashed var(--line);padding:12px;border-radius:10px;margin-top:18px}summary{cursor:pointer;color:var(--gold)}.log{margin-top:18px}.log summary{color:var(--muted)}.log-item{border-left:2px solid var(--line);padding:8px 16px;margin-top:8px}#report{display:none}.report-item{break-inside:avoid;border-bottom:1px solid var(--line);padding:15px 0}.report-item p{white-space:pre-wrap;overflow-wrap:anywhere}footer{padding:25px 0 40px;color:var(--muted);font-size:.8rem}#notice{color:var(--gold)}[hidden]{display:none!important}@media(max-width:600px){.panel,.message{padding:18px}.reply{margin-left:20px}.row{grid-template-columns:1fr}header{font-size:.85rem}.order li{gap:6px}.order button{padding:5px 9px}}@media print{html{color-scheme:light}body{background:white;color:#111;font:11pt/1.5 Arial,sans-serif}header,.intro,#workspace,#log,.progress,footer,.no-print{display:none!important}#report{display:block!important}main{width:100%}.panel{background:white;border:0;padding:0}.muted,.eyebrow,.speaker{color:#333}.report-item{border-color:#ccc}h1{font-size:22pt}h2{font-size:14pt}@page{size:A4;margin:18mm}}
.dot.active{background:var(--gold)}.era{display:inline-block;color:var(--gold);border-bottom:1px solid var(--line);padding-bottom:8px}.archive{border-left:2px solid var(--cyan);padding:2px 16px 16px;margin-block:20px}.strip-grid{display:grid;gap:6px;max-width:480px;margin-block:18px}.strip-grid span{display:grid;place-items:center;aspect-ratio:1.3;border:1px solid #648d8e;background:#164340;color:var(--gold);font-size:1.3rem;border-radius:7px}.cipher-inline{font-family:Consolas,monospace;color:var(--gold);overflow-wrap:anywhere}.intro{position:relative}.intro:after{content:'◷';position:absolute;right:0;top:15px;font-size:8rem;line-height:1;color:#63e9db10;pointer-events:none}.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(58px,1fr));gap:10px;margin-top:20px}.legend>div{display:grid;place-items:center;border:1px solid var(--line);padding:8px;border-radius:8px}.glyphs{display:flex;gap:8px;flex-wrap:wrap;color:var(--gold)}.alphabet>div{display:flex;gap:9px}.alphabet span{display:grid;place-items:center;min-width:25px}.alphabet small{color:var(--muted)}.barrow{display:flex;align-items:center;gap:14px;margin-block:10px}.variants{max-height:350px;overflow:auto;margin-block:15px;background:#071824;padding:15px}.variants>div{display:flex;gap:25px;font-family:Consolas,monospace}#report[hidden]{display:none}#report:not([hidden]){display:block}.report-item p{white-space:pre-wrap}.feedback.good{border-color:var(--cyan)}#progress{padding:20px 0;color:var(--gold)}@media print{#app,#progress,footer,header,.no-print{display:none!important}.legend>div{break-inside:avoid}.glyphs,.legend{color:#111}.legend{grid-template-columns:repeat(9,1fr)}}</style></head><body><header><a href="mission-21.html">← До теми</a><span>КРИПТОГРАФІЯ · ПРАКТИКА</span></header><main><section class="intro"><span class="eyebrow">Розділ 1 · Шифри минулого</span><h1>Атбаш · Дзеркало архіву</h1></section><div id="progress"></div><div id="app"></div><section id="report" class="panel" hidden><div id="report-content"></div><div class="actions no-print"><button class="primary" id="pdf">Завантажити PDF</button><button id="print">Друк / Зберегти як PDF</button><button id="html">Завантажити звіт HTML</button></div><p id="notice" role="status"></p></section></main><footer>Збережіть звіт перед закриттям вкладки. Українські шифри використовують 33 літери; Пігпен у цій вправі — латинські A–Z.</footer><noscript>Увімкніть JavaScript для проходження практики.</noscript><script>const CFG={"kind": "atbash", "title": "Атбаш · Дзеркало архіву", "story": "Хранитель переплутав початок і кінець абетки. Прочитайте повідомлення та надішліть відповідь."};
const ABC='АБВГҐДЕЄЖЗИІЇЙКЛМНОПРСТУФХЦЧШЩЬЮЯ';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>s.toUpperCase().replace(/[^А-ЯІЇЄҐ]/g,'');
const S={step:0,name:'',group:'',answers:[],attempts:0,start:new Date()};
const caesar=(s,k)=>[...s.toUpperCase()].map(c=>ABC.includes(c)?ABC[(ABC.indexOf(c)+k%33+33)%33]:c).join('');
const atbash=s=>[...s.toUpperCase()].map(c=>ABC.includes(c)?ABC[32-ABC.indexOf(c)]:c).join('');
function vigenere(text,key){const k=norm(key);let j=0;if(!k)return '';return [...text.toUpperCase()].map(c=>ABC.includes(c)?ABC[(ABC.indexOf(c)+ABC.indexOf(k[j++%k.length]))%33]:c).join('')}
function pig(c){const i='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.indexOf(c);if(i<0)return '<span>·</span>';let lines='',dot='';const line=(x1,y1,x2,y2)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;if(i<18){const n=i%9,row=Math.floor(n/3),col=n%3;if(row>0)lines+=line(5,5,35,5);if(row<2)lines+=line(5,35,35,35);if(col>0)lines+=line(5,5,5,35);if(col<2)lines+=line(35,5,35,35);if(i>=9)dot='<circle cx="20" cy="20" r="3" fill="currentColor" stroke="none"/>'}else{const n=(i-18)%4;const pairs=[[[5,5],[20,25],[35,5]],[[35,5],[15,20],[35,35]],[[5,35],[20,15],[35,35]],[[5,5],[25,20],[5,35]]];const q=pairs[n];lines=line(...q[0],...q[1])+line(...q[1],...q[2]);if(i>=22)dot='<circle cx="20" cy="20" r="2.5" fill="currentColor" stroke="none"/>'}return `<svg viewBox="0 0 40 40" role="img" aria-label="Графічний символ" style="width:40px;height:40px"><g fill="none" stroke="currentColor" stroke-width="2.5">${lines}${dot}</g></svg>`}
const legend=()=>'<div class="legend">'+[...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'].map(c=>`<div>${pig(c)}<b>${c}</b></div>`).join('')+'</div>';
const glyphs=s=>'<div class="glyphs">'+[...s].map(pig).join('')+'</div>';
const alphabet=()=>`<div class="alphabet"><div>${[...ABC].map((c,i)=>`<span><b>${c}</b><small>${i}</small></span>`).join('')}</div></div>`;
function note(text,good=false){$('feedback').hidden=false;$('feedback').textContent=text;$('feedback').className='feedback'+(good?' good':'')}
function shell(title,body){$('app').innerHTML=`<section class="panel"><span class="eyebrow">🐈 Криптокіт · ${S.step?`Крок ${S.step} з 3`:'Початок'}</span><h2>${title}</h2>${body}<div id="feedback" role="status" hidden></div><div class="actions" id="actions"></div></section>`;$('progress').textContent=S.step?`Виконано: ${Math.min(S.step-1,3)} / 3`:'Експедиція чекає на вас'}
function save(title,answer,noteText){S.answers.push({title,answer,note:noteText,attempts:S.attempts});note('Запис збережено у звіті. Можна рухатися далі.',true);$('check').disabled=true;const b=document.createElement('button');b.textContent=S.step===2?'Створити власний приклад →':'Наступний крок →';b.className='primary';b.onclick=()=>{S.step++;S.attempts=0;render()};$('actions').append(b)}
function check(fn){const b=document.createElement('button');b.id='check';b.className='primary';b.textContent='Перевірити';b.onclick=fn;$('actions').append(b)}
function render(){
 if(S.step===0){shell('Вітаю у новій справі!',`<p>${CFG.story}</p><label for="name">Ім’я / псевдонім</label><input id="name" maxlength="70"><label for="group">Клас / група (за бажанням)</label><input id="group" maxlength="50"><p class="muted">Після трьох кроків сформується звіт. Власне пояснення перевіряє вчитель. Відповіді залишаються у вкладці до її закриття.</p>`);const b=document.createElement('button');b.textContent='Відкрити справу →';b.className='primary';b.onclick=()=>{S.name=$('name').value.trim();if(!S.name){note('Вкажіть ім’я або псевдонім.');return}S.group=$('group').value.trim();S.step=1;render()};$('actions').append(b);return}
 if(S.step===3){own();return}
 if(CFG.kind==='draw'){
  const word=S.step===1?'PORTAL':'ARCHIVE';shell(S.step===1?'Таємний знак на дверях':'Другий запис у щоденнику',`<p>Відновіть англійське слово за графічними символами. Навчальна таблиця Пігпена використовує латинські A–Z; крапка розрізняє схожі знаки.</p>${glyphs(word)}<details open><summary>Таблиця відповідностей</summary>${legend()}</details><label for="answer">Відкрите слово латиницею</label><input id="answer" maxlength="30" autocomplete="off">`);check(()=>{const answer=$('answer').value.trim().toUpperCase();if(!answer){note('Введіть слово.');return}S.attempts++;if(answer!==word){note('Перевірте орієнтацію ліній і наявність крапок. Порівнюйте кожен знак із таблицею.');return}save(S.step===1?'Знак на дверях':'Запис у щоденнику',word,'Графічний знак замінює літеру; крапка є частиною знака.')});return}
 if(CFG.kind==='atbash'){
  const word=S.step===1?'ТАЄМНИЦЯ':'АРХІВ';shell(S.step===1?'Дзеркало з архіву':'Відповідь хранителю',`<p>${S.step===1?'Розшифруйте напис дзеркальною абеткою.':'Зашифруйте слово АРХІВ. Атбаш застосовує те саме правило в обох напрямках.'}</p><div class="cipher">${S.step===1?atbash(word):word}</div><div class="alphabet"><p>${[...ABC].join(' ')}</p><p>${[...ABC].reverse().join(' ')}</p></div><label for="answer">${S.step===1?'Відкритий текст':'Шифротекст'}</label><input id="answer" maxlength="40" autocomplete="off">`);check(()=>{const answer=norm($('answer').value);if(!answer){note('Введіть повідомлення.');return}S.attempts++;const correct=S.step===1?word:atbash(word);if(answer!==correct){note('Знайдіть літеру у верхній абетці й візьміть відповідну з нижньої. Не пропускайте Ґ, Є, І та Ї.');return}save(S.step===1?'Розшифрування Атбашу':'Шифрування Атбашем',`${S.step===1?atbash(word):word} → ${correct}`,'Дзеркальне перетворення двічі повертає початковий текст.')});return}
 if(CFG.kind==='caesar'){
  if(S.step===1){const encrypted=caesar('АРХІВ',7);shell('Знайдіть двері до архіву',`<p>Напис ${encrypted} приховує назву місця, де зберігають документи. При шифруванні виконано зсув уперед; повзунок виконує зворотний зсув.</p><label for="shift">Ключ: <b id="shift-label">0</b></label><input type="range" id="shift" min="0" max="32" value="0"><div id="decoded" class="cipher"></div>`);$('shift').oninput=()=>{$('shift-label').textContent=$('shift').value;$('decoded').textContent=caesar(encrypted,-Number($('shift').value))};$('shift').oninput();check(()=>{S.attempts++;if(Number($('shift').value)!==7){note('Змініть ключ, щоб отримати слово за підказкою.');return}save('Пошук зсуву',`${encrypted} → АРХІВ; ключ 7`,'При дешифруванні зсув виконуємо у зворотний бік.')});return}
  shell('Залиште короткий знак',`<p>Зашифруйте слово <strong>КІТ</strong> зсувом <strong>4 вперед</strong>. Нумерація починається з нуля. Формула: (номер літери + 4) mod 33.</p>${alphabet()}<label for="answer">Шифротекст</label><input id="answer" maxlength="20" autocomplete="off">`);check(()=>{if(!norm($('answer').value)){note('Введіть шифротекст.');return}S.attempts++;if(norm($('answer').value)!==caesar('КІТ',4)){note('Додайте 4 до номера кожної літери. Якщо число перевищило 32, відніміть 33.');return}save('Шифрування Цезарем',`КІТ → ${caesar('КІТ',4)}; ключ 4`,'Використано всі 33 літери української абетки.')});return
 }
 if(CFG.kind==='keys'){
  if(S.step===1){const encrypted=caesar('ПОРТАЛ',4);shell('Ключ загублено',`<p>Потрібно відкрити прохід між епохами. Шифротекст: <strong>${encrypted}</strong>. Алгоритм — Цезар, ключ невідомий.</p><button id="brute">Показати всі варіанти дешифрування</button><div id="variants" class="variants" hidden></div><label for="key">Який ключ утворює слово за підказкою?</label><input id="key" type="number" min="0" max="32">`);$('brute').onclick=()=>{$('variants').hidden=false;$('variants').innerHTML=Array.from({length:33},(_,i)=>`<div><b>${i}</b> ${caesar(encrypted,-i)}</div>`).join('')};check(()=>{if($('key').value===''){note('Введіть знайдений ключ.');return}S.attempts++;if(Number($('key').value)!==4){note('Шукаємо слово ПОРТАЛ. Зіставте його з варіантами перебору.');return}save('Перебір ключів',`${encrypted} → ПОРТАЛ; ключ 4`,'Перебрано 33 значення зсуву, включно з нулем.')});return}
  const text='ЯБЯВГЯБЯДЯВЯБЯ';const freq={};for(const c of text)freq[c]=(freq[c]||0)+1;const sorted=Object.entries(freq).sort((a,b)=>b[1]-a[1]);shell('Частотний слід',`<p>Навчальний фрагмент: <strong>${text}</strong>. Це короткий штучний приклад для підрахунку частот, а не текст із гарантованим мовним розподілом.</p><button id="count">Порахувати літери</button><div id="bars" hidden></div><label for="answer">Який символ трапляється найчастіше?</label><input id="answer" maxlength="2"><label for="claim">Який висновок обґрунтований?</label><select id="claim"><option value="">Оберіть висновок</option><option value="certain">Цей символ обов’язково означає О</option><option value="hypothesis">Частота дає гіпотезу, яку треба перевірити на всьому тексті</option></select>`);$('count').onclick=()=>{$('bars').hidden=false;$('bars').innerHTML=sorted.map(([c,n])=>`<div class="barrow"><b>${c}</b><div style="width:${n/sorted[0][1]*70}%;background:#63e9db;height:15px"></div><span>${n}</span></div>`).join('')};check(()=>{if(!norm($('answer').value)||!$('claim').value){note('Вкажіть символ і висновок.');return}S.attempts++;if(norm($('answer').value)!==sorted[0][0]||$('claim').value!=='hypothesis'){note('Найчастіша літера шифротексту не має гарантованого відповідника. Особливо ненадійні висновки з короткого фрагмента.');return}save('Частотний аналіз',`${sorted[0][0]}: ${sorted[0][1]} разів. Частота дає гіпотезу, яку перевіряємо далі.`,'Підрахунок частот і встановлення відповідності літер — різні етапи.')});return
 }
 if(CFG.kind==='vigenere'){
  if(S.step===1){shell('Ключ, що повторюється',`<p>Повідомлення: <strong>ПОРТАЛ</strong>. Ключове слово: <strong>КІТ</strong>. Запишіть повторений ключ із шести літер, щоб кожна літера повідомлення отримала свою літеру ключа.</p><label for="answer">Ключ під усім повідомленням</label><input id="answer" maxlength="20" autocomplete="off">`);check(()=>{if(!norm($('answer').value)){note('Запишіть повторений ключ.');return}S.attempts++;if(norm($('answer').value)!=='КІТКІТ'){note('Після останньої літери ключа поверніться до першої: К, І, Т, К…');return}save('Розгортання ключа','ПОРТАЛ\nКІТКІТ','Ключ повторюється до кількості літер повідомлення.')});return}
  shell('Три різні зсуви',`<p>Зашифруйте <strong>МИР</strong> ключем <strong>КОД</strong>. Для кожної пари додайте номери літер за модулем 33: c = (m + k) mod 33.</p>${alphabet()}<div class="pairs"><p>М + К = (16 + 14) mod 33</p><p>И + О = (10 + 18) mod 33</p><p>Р + Д = (20 + 5) mod 33</p></div><label for="answer">Три літери шифротексту</label><input id="answer" maxlength="10" autocomplete="off">`);check(()=>{if(!norm($('answer').value)){note('Обчисліть і запишіть три літери.');return}S.attempts++;if(norm($('answer').value)!==vigenere('МИР','КОД')){note('Перевірте додавання номерів. Знайдіть літери з номерами 30, 28 і 25.');return}save('Шифрування Віженером',`МИР + КОД → ${vigenere('МИР','КОД')}`,'Зсув визначає чергова літера ключа, а не одне постійне число.')});return
 }
}
function own(){const graphic=CFG.kind==='draw',isV=CFG.kind==='vigenere',isA=CFG.kind==='atbash';shell('Ваш артефакт для наступної експедиції',`<p>Створіть власний приклад і поясніть одержувачу, як його прочитати.</p><label for="own">Повідомлення ${graphic?'латиницею A–Z':'українською'} (3–80 літер)</label><textarea id="own" maxlength="160"></textarea>${!graphic&&!isA?`<label for="ownkey">${isV?'Ключове слово українською':'Ключ Цезаря (1–32)'}</label><input id="ownkey" ${isV?'maxlength="30"':'type="number" min="1" max="32" value="3"'}>`:''}<button id="encode">Створити артефакт</button><div id="artifact" class="cipher" hidden></div><label for="explain">Як одержувач відновить текст і в чому слабкість такого шифру?</label><textarea id="explain" maxlength="900"></textarea><p class="muted">Пояснення потрапить до звіту. Автоматично перевіряється заповнення; зміст оцінює вчитель.</p>`);let result=null;const reset=()=>{result=null;$('artifact').hidden=true};$('own').oninput=reset;if($('ownkey'))$('ownkey').oninput=reset;
 $('encode').onclick=()=>{const raw=$('own').value.trim().toUpperCase(),text=graphic?raw.replace(/[^A-Z]/g,''):norm(raw);if(text.length<3||text.length>80){note('Введіть від 3 до 80 літер потрібної абетки.');return}if(graphic?/[А-ЯІЇЄҐ]/.test(raw):/[A-ZЁЪЫЭ]/.test(raw)){note('Використайте вказану абетку.');return}let key='Фіксована таблиця',cipher='';if(graphic){cipher='Див. графічну таблицю нижче';$('artifact').innerHTML=glyphs(text)+'<p class="muted" style="font-size:16px;letter-spacing:0">Кожен знак відповідає літері за таблицею в цій вправі.</p>'}else if(isA){cipher=atbash(text);$('artifact').textContent=cipher}else if(isV){key=norm($('ownkey').value);if(!key||/[A-ZЁЪЫЭ]/.test($('ownkey').value.toUpperCase())){note('Вкажіть ключове слово українською.');return}cipher=vigenere(text,key);$('artifact').textContent=cipher}else{key=Number($('ownkey').value);if(!Number.isInteger(key)||key<1||key>32){note('Потрібне ціле число від 1 до 32.');return}cipher=caesar(text,key);$('artifact').textContent=cipher}result={text,key,cipher};$('artifact').hidden=false;note('Артефакт створено. Додайте інструкцію.',true)};
 const b=document.createElement('button');b.id='check';b.className='primary';b.textContent='Сформувати звіт';b.onclick=()=>{if(!result){note('Спочатку створіть артефакт.');return}const explain=$('explain').value.trim();if(explain.length<25){note('Додайте інструкцію та пояснення слабкості шифру, щонайменше 25 символів.');return}S.answers.push({title:'Власний артефакт',answer:`Відкритий текст: ${result.text}\nКлюч: ${result.key}\nШифротекст: ${result.cipher}\nІнструкція: ${explain}`,note:'Власне пояснення перевіряє вчитель.',attempts:null,graphic:graphic?result.text:null});S.finished=new Date();S.step=4;report()};$('actions').append(b)
}
function report(){ $('app').hidden=true;$('report').hidden=false;$('progress').textContent='Виконано: 3 / 3';$('report-content').innerHTML=`<h1>${esc(CFG.title)} · звіт</h1><p><strong>${esc(S.name)}</strong> ${esc(S.group)}</p><p>${esc(S.finished.toLocaleString('uk-UA'))}</p><p>Три кроки завершено. Перші два перевірено автоматично. Пояснення до власного артефакту перевіряє вчитель.</p>`+S.answers.map(r=>`<article class="report-item"><h2>${esc(r.title)}</h2><p>${esc(r.answer)}</p>${r.graphic?glyphs(r.graphic):''}${r.attempts!==null?`<p>Спроб перевірки: ${r.attempts}</p>`:''}<p>${esc(r.note)}</p></article>`).join('');if(CFG.kind==='draw')$('report-content').innerHTML+='<h2>Таблиця Пігпена для перевірки артефакту</h2>'+legend(); }
function download(blob,name){const a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)}
$('print').onclick=()=>window.print();$('html').onclick=()=>download(new Blob(['<!DOCTYPE html><html lang="uk"><meta charset="utf-8"><title>Звіт</title><style>body{font:17px/1.6 Arial;max-width:800px;margin:30px auto;padding:20px}p{white-space:pre-wrap;overflow-wrap:anywhere}.legend{display:flex;flex-wrap:wrap;gap:15px}.legend>div{display:grid;text-align:center;min-width:45px}.glyphs{display:flex;flex-wrap:wrap}</style>'+$('report-content').innerHTML+'</html>'],{type:'text/html;charset=utf-8'}),`crypto-${CFG.kind}-report.html`);
render();
async function makePDF(lines){
 await document.fonts.ready;
 const W=1240,H=1754,margin=90,lh=35,pages=[];let canvas,ctx,y;
 function newPage(){canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.fillStyle='#172633';ctx.font='23px Arial';y=margin}
 function flush(){ctx.fillStyle='#6a7782';ctx.font='18px Arial';ctx.fillText(`Криптографія · ${CFG.title} · Сторінка ${pages.length+1}`,margin,H-45);const b64=canvas.toDataURL('image/jpeg',.93).split(',')[1];pages.push(Uint8Array.from(atob(b64),c=>c.charCodeAt(0)))}
 newPage();
 const sections=[];let section=[];
 for(const line of lines){if(line===''){if(section.length)sections.push(section);section=[]}else section.push(line)}if(section.length)sections.push(section);
 const headings=new Set(S.answers.map(r=>r.title).concat(['ВИСНОВОК','ПАСПОРТ МАНДРІВНИКА']));
 for(const block of sections){
  const rows=[];
  for(const source of block){const isHeading=headings.has(source);ctx.font=isHeading?'bold 26px Arial':'23px Arial';let line='';for(const word of source.split(' ')){if(ctx.measureText((line?line+' ':'')+word).width>W-2*margin&&line){rows.push({text:line,heading:isHeading});line=''}for(const char of (line?' ':'')+word){if(ctx.measureText(line+char).width>W-2*margin){rows.push({text:line,heading:isHeading});line=''}line+=char}}rows.push({text:line,heading:isHeading})}
  const height=(rows.length+1)*lh;if(y+height>H-margin&&height<H-2*margin){flush();newPage()}
  for(const row of rows){if(y>H-margin){flush();newPage()}ctx.font=row.heading?'bold 26px Arial':'23px Arial';ctx.fillStyle=row.heading?'#164a4b':'#172633';ctx.fillText(row.text,margin,y);y+=lh}y+=lh;
 }
 if(CFG.kind==='draw'){
  flush();newPage();ctx.fillStyle='#172633';ctx.font='bold 28px Arial';ctx.fillText('Графічний артефакт Пігпена',margin,y);y+=65;
  const drawSymbol=(c,x,y,size)=>{const index='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.indexOf(c);ctx.save();ctx.translate(x,y);ctx.scale(size/40,size/40);ctx.strokeStyle='#172633';ctx.fillStyle='#172633';ctx.lineWidth=2.5;const line=(a,b,c,d)=>{ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(c,d);ctx.stroke()};
   if(index<18){const n=index%9,row=Math.floor(n/3),col=n%3;if(row>0)line(5,5,35,5);if(row<2)line(5,35,35,35);if(col>0)line(5,5,5,35);if(col<2)line(35,5,35,35);if(index>=9){ctx.beginPath();ctx.arc(20,20,3,0,Math.PI*2);ctx.fill()}}
   else{const pairs=[[[5,5],[20,25],[35,5]],[[35,5],[15,20],[35,35]],[[5,35],[20,15],[35,35]],[[5,5],[25,20],[5,35]]],q=pairs[(index-18)%4];line(...q[0],...q[1]);line(...q[1],...q[2]);if(index>=22){ctx.beginPath();ctx.arc(20,20,2.5,0,Math.PI*2);ctx.fill()}}ctx.restore();
  };
  const artifact=S.answers.find(r=>r.graphic)?.graphic||'';let x=margin;
  for(const c of artifact){if(x+60>W-margin){x=margin;y+=70}if(y+90>H-margin){flush();newPage();x=margin}drawSymbol(c,x,y,50);x+=65}y+=110;
  if(y+470>H-margin){flush();newPage()}
  ctx.font='bold 26px Arial';ctx.fillText('Таблиця для перевірки',margin,y);y+=45;
  [...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'].forEach((c,i)=>{const x=margin+(i%9)*115,yy=y+Math.floor(i/9)*120;drawSymbol(c,x,yy,55);ctx.font='23px Arial';ctx.fillText(c,x+18,yy+87)});
 }flush();

 const enc=new TextEncoder(),chunks=[],offsets=[0];let length=0;
 const push=data=>{const bytes=typeof data==='string'?enc.encode(data):data;chunks.push(bytes);length+=bytes.length};
 const object=(n,body)=>{offsets[n]=length;push(`${n} 0 obj\n`);push(body);push('\nendobj\n')};
 push('%PDF-1.4\n%CryptoReport\n');object(1,'<< /Type /Catalog /Pages 2 0 R >>');object(2,`<< /Type /Pages /Count ${pages.length} /Kids [${pages.map((_,i)=>`${3+i*3} 0 R`).join(' ')}] >>`);
 pages.forEach((jpeg,i)=>{const n=3+i*3;object(n,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 ${n+1} 0 R >> >> /Contents ${n+2} 0 R >>`);offsets[n+1]=length;push(`${n+1} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${W} /Height ${H} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpeg.length} >>\nstream\n`);push(jpeg);push('\nendstream\nendobj\n');const command='q\n595.28 0 0 841.89 0 0 cm\n/Im0 Do\nQ';object(n+2,`<< /Length ${enc.encode(command).length} >>\nstream\n${command}\nendstream`)});
 const xref=length,total=3+pages.length*3;push(`xref\n0 ${total}\n0000000000 65535 f \n`);for(let i=1;i<total;i++)push(`${String(offsets[i]).padStart(10,'0')} 00000 n \n`);push(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);return new Blob(chunks,{type:'application/pdf'});
}

$('pdf').onclick=async()=>{const b=$('pdf');b.disabled=true;$('notice').textContent='Формую PDF…';try{const lines=[CFG.title+' · звіт',`Ім’я: ${S.name}`,`Клас / група: ${S.group||'не вказано'}`,`Дата: ${S.finished.toLocaleString('uk-UA')}`,'Кроки 1–2 перевірено автоматично. Пояснення до власного артефакту оцінює вчитель.',...S.answers.flatMap(r=>['',r.title,...r.answer.split('\n'),r.attempts!==null?'Спроб перевірки: '+r.attempts:'',r.note])];download(await makePDF(lines),`crypto-${CFG.kind}-report.pdf`);$('notice').textContent='PDF сформовано. Перевірте завантаження браузера.'}catch(e){$('notice').textContent='Скористайтеся кнопкою «Друк / Зберегти як PDF».'}finally{b.disabled=false}};
</script></body></html>
