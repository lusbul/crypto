<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Практика 1 · AES</title><link rel="stylesheet" href="styles.css"><script defer src="common.js"></script></head><body><main class="wrap"><a href="index.html">← До місії 2.7</a><h1>Практика 1. Збери матрицю</h1><section><h2>Розмістіть байти за стовпцями</h2><p>Перетягніть байт на порожнє місце або натисніть на байт, а потім на комірку. На телефоні працюють натискання.</p><div id="bank" class="palette"></div><div id="board" class="matrix"></div><div class="row"><button class="btn" id="check">Перевірити</button><button class="btn alt" id="hint">Підказка</button><button class="btn alt" id="again">Інший набір</button></div><p id="out" class="result" aria-live="polite"></p></section><script>window.addEventListener('DOMContentLoaded',()=>{let base=0,values=[],picked=null,placed=[];function draw(){values=Array.from({length:16},(_,i)=>(base+i)&255);placed=Array(16).fill(null);picked=null;let bank=$('bank'),board=$('board');bank.innerHTML='';board.innerHTML='';[...values].sort(()=>Math.random()-.5).forEach(v=>{let b=document.createElement('button');b.className='token';b.textContent=hx(v);b.draggable=true;b.dataset.val=v;b.onclick=()=>{picked=v;bank.querySelectorAll('button').forEach(x=>x.classList.toggle('sel',x===b))};b.ondragstart=e=>{picked=v;e.dataTransfer.setData('text/plain',String(v))};bank.append(b)});for(let r=0;r<4;r++)for(let c=0;c<4;c++){let i=r*4+c,b=document.createElement('button');b.className='cell slot';b.textContent='·';b.setAttribute('aria-label',`Рядок ${r+1}, стовпець ${c+1}`);function set(v){if(v===null||!values.includes(v))return;let old=placed[i];placed[i]=v;b.textContent=hx(v);bank.querySelectorAll('button').forEach(x=>x.disabled=placed.includes(+x.dataset.val));if(old!==null&&!placed.includes(old))bank.querySelector(`[data-val="${old}"]`).disabled=false;picked=null;bank.querySelectorAll('button').forEach(x=>x.classList.remove('sel'))}b.onclick=()=>{if(picked!==null)set(picked);else if(placed[i]!==null){let v=placed[i];placed[i]=null;b.textContent='·';bank.querySelector(`[data-val="${v}"]`).disabled=false}};b.ondragover=e=>e.preventDefault();b.ondrop=e=>{e.preventDefault();let v=Number(e.dataTransfer.getData('text/plain'));set(v)};board.append(b)}note('out','Завдання: перший стовпець — перші чотири байти.')}$('check').onclick=()=>{let ok=placed.every((v,i)=>v===values[4*(i%4)+Math.floor(i/4)]);note('out',ok?'Чудово! AES заповнює матрицю за стовпцями.':'Є неточності. Перевірте порядок: зверху вниз у кожному стовпці.',ok)};$('hint').onclick=()=>note('out','Перший стовпець: '+values.slice(0,4).map(hx).join(' ')+'. Другий: '+values.slice(4,8).map(hx).join(' '));$('again').onclick=()=>{base=(base+16)&255;draw()};draw()})</script><footer>Місія 2.7 · AES</footer></main></body></html>
